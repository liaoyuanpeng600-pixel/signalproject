[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-core"
version = "0.1.0"
description = "Deterministic core, workflow, runtime, persistence, research, and reporting for SIGNAL"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "Proprietary"}
authors = [
    {name = "Signal Project Maintainer"}
]
keywords = ["research", "knowledge-graph", "evidence", "analysis"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mypy>=1.10",
    "ruff>=0.6",
]

[project.urls]
"Architecture" = "docs/00_ARCHITECTURE_PRINCIPLES.md"
"Object Model" = "docs/01_OBJECT_MODEL.md"
"Workflow Model" = "docs/02_WORKFLOW_MODEL.md"
"Runtime Model" = "docs/03_RUNTIME_MODEL.md"
"Roadmap" = "docs/IMPLEMENTATION_ROADMAP.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/core"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
